<!-- ── FANUC Config Node ─────────────────────────────────────────────────── -->
<script type="text/javascript">
    RED.nodes.registerType('fanuc-config', {
        category: 'config',
        defaults: {
            name:       { value: '' },
            host:       { value: '192.168.0.100', required: true },
            port:       { value: '8193',          required: true },
            cnc_series: { value: '16',            required: true },
        },
        label: function() {
            return this.name || `${this.host}:${this.port}`;
        }
    });
</script>

<script type="text/html" data-template-name="fanuc-config">

        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>

</script>


<!-- ── FANUC Poll Node ───────────────────────────────────────────────────── -->
<script type="text/javascript">

    // Axes Data sub-types (mirrors the screenshot)
    const FANUC_AXIS_TYPES = [
        { group: 'Position', options: [
            { v: 'abs_pos',    l: 'Absolute position' },
            { v: 'machine_pos',l: 'Machine position' },
            { v: 'rel_pos',    l: 'Relative position' },
            { v: 'dist_to_go', l: 'Distance to go' },
        ]},
        { group: 'Servo', options: [
            { v: 'servo_load',    l: 'Servo load meter (percentage)' },
            { v: 'servo_current', l: 'Servo load current (Ampere)' },
        ]},
        { group: 'Spindle', options: [
            { v: 'spindle_load',  l: 'Spindle load meter (percentage)' },
            { v: 'spindle_speed', l: 'Spindle motor speed (rpm)' },
        ]},
        { group: 'Feed', options: [
            { v: 'feedrate', l: 'Actual feedrate (mm/min)' },
        ]},
    ];

    // Functions that need no extra config
    const FANUC_SIMPLE_FNS = new Set([
        'status_info','system_info','timers','program_number',
        'part_count','tool_life','tool_offsets','alarm_messages','alarm_status',
        'pmc_alarms','all'
    ]);

    RED.nodes.registerType('fanuc-focas', {
        category:    'input',
        color:       '#f5d128',
        defaults: {
            name:    { value: '' },
            server:  { value: '', type: 'fanuc-config', required: true },
            fn:      { value: 'all' },
            subtype: { value: 'feedrate' },
            params:  { value: '' },
        },
        inputs:  1,
        outputs: 1,
        icon:    'inject.png',
        label: function() {
            const cfg = RED.nodes.node(this.server);
            const host = cfg ? cfg.label() : '';
            const fnLabel = {
                all:            'All Data',
                status_info:    'Status Info',
                system_info:    'System Info',
                timers:         'Timers',
                axes_data:      'Axes Data',
                parameters:     'Parameters',
                program_number: 'Program Number',
                part_count:     'Part Count',
                tool_life:      'Tool Life',
                tool_offsets:   'Tool Offsets',
                alarm_messages: 'Alarm Messages',
                alarm_status:   'Alarm Status',
                pmc_alarms:     'PMC Alarms',
                macro:          'Macro',
                machine_id:     'Machine ID',
                calendar:       'Calendar',
                status_info2:   'Status Info (extended)',
                program_memory: 'Program Memory',
                sequence_number:'Sequence Number',
                block_count:    'Block Counter',
                command:        'Modal / Commanded F,S,T',
                work_zero_offsets:'Work Zero Offsets',
                maintenance:    'Maintenance Items',
                pmc_read:       'PMC Read',
            }[this.fn] || this.fn;
            return this.name || (host ? `${host} · ${fnLabel}` : fnLabel);
        },
        paletteLabel: 'fanuc focas',

        oneditprepare: function() {
            const node = this;

            // Build axes sub-type select with optgroups
            const $axisType = $('#node-input-subtype');
            $axisType.empty();
            FANUC_AXIS_TYPES.forEach(group => {
                const $g = $('<optgroup>').attr('label', group.group);
                group.options.forEach(o => {
                    $g.append($('<option>').val(o.v).text(o.l));
                });
                $axisType.append($g);
            });

            function updateVisibility() {
                const fn = $('#node-input-fn').val();
                $('#fanuc-row-subtype').toggle(fn === 'axes_data');
                $('#fanuc-row-cmdblock').toggle(fn === 'command');
                $('#fanuc-row-params').toggle(
                    fn === 'parameters' || fn === 'macro' || fn === 'pmc_read');
                // Update params label
                if (fn === 'macro') {
                    $('#fanuc-params-label').text('Macro variables');
                    $('#fanuc-params-hint').text('Comma-separated macro numbers e.g. 3901,3902');
                } else if (fn === 'pmc_read') {
                    $('#fanuc-params-label').text('PMC addresses');
                    $('#fanuc-params-hint').text(
                        'Comma-separated, e.g. R0.0,D100:word,K0.0 — ' +
                        'areas G F Y X A R T K C D; :byte / :word / :long, or .<bit> for one bit');
                    $('#node-input-params').attr('placeholder', 'R0.0,D100:word,K0.0');
                } else {
                    $('#fanuc-params-label').text('Parameter numbers');
                    $('#fanuc-params-hint').text('Comma-separated param numbers e.g. 6711,6712');
                    $('#node-input-params').attr('placeholder', '6711,6712');
                }
            }

            $('#node-input-fn').on('change', updateVisibility);

            // Restore saved values
            $('#node-input-fn').val(node.fn || 'all');
            $axisType.val(node.subtype || 'feedrate');
            $('#node-input-cmdblock').val(node.cmdblock || 'modal');
            $('#node-input-params').val(node.params || '');

            updateVisibility();
        },

        oneditsave: function() {
            // `command` reuses the subtype slot for its block selector, so the two
            // never collide: subtype is only read when fn=axes_data.
            if ($('#node-input-fn').val() === 'command') {
                this.subtype = $('#node-input-cmdblock').val();
            }
        },
    });
</script>

    <!-- Command block — shown only when fn=command -->
    <div class="form-row" id="fanuc-row-cmdblock" style="display:none">

            <option value="modal">Modal (what is in effect)</option>

        </select>
    </div>

    <!-- Param / macro numbers — shown only when fn=parameters or fn=macro -->
    <div class="form-row" id="fanuc-row-params" style="display:none">
        <label for="node-input-params">
            <i class="fa fa-hashtag"></i>
            <span id="fanuc-params-label">Parameter numbers</span>
        </label>
        <input type="text" id="node-input-params" placeholder="6711,6712" style="width:70%">
        <div class="form-tips" id="fanuc-params-hint" style="margin-top:4px">
            Comma-separated param numbers e.g. 6711,6712
        </div>
    </div>
</script>

<script type="text/html" data-help-name="fanuc-focas">
    <p>Polls a FANUC CNC controller via FOCAS2 TCP and outputs <code>msg.payload</code>.</p>

    <h3>Function</h3>
    <dl class="message-properties">
        <dt>All Data</dt><dd>Full combined payload (controller, state, timers, program, alarms)</dd>
        <dt>Status Info</dt><dd>mode, run_state, motion, alarm, emergency, edit.
            <code>motion</code> is <code>Stopped</code> / <code>Moving</code> /
            <code>Dwelling</code> / <code>Waiting</code>; <code>mstb</code> is
            <code>Finished</code> when the M/S/T/B function has completed.</dd>
        <dt>System Info</dt><dd>cnc_type, mt_type, series, version, axes, max_axes.
            <code>axes</code> is the <em>current</em> controlled axis count;
            <code>max_axes</code> is the maximum the CNC can control.</dd>
        <dt>Timers</dt><dd>power_on, auto_operation, cutting, cycle — with total_seconds and formatted</dd>
        <dt>Axes Data</dt><dd>Position, servo/spindle load, feedrate — select sub-type.
            Servo load returns one value per axis (<code>servo_load_percent</code>, array) alongside
            <code>servo_load_axes</code>; servo load current returns the same axes in Ampere
            (<code>servo_load_current_amps</code>); spindle load returns
            <code>spindle_load_percent</code> (first spindle) with <code>spindle_load_percents</code>
            and <code>spindle_load_names</code>.</dd>
        <dt>Parameters</dt><dd>Raw parameter values by number</dd>
        <dt>Program Number</dt><dd>Running and main program numbers with comments</dd>
        <dt>Part Count</dt><dd>Required and lifetime total parts</dd>
        <dt>Tool Life</dt><dd>Per tool group: tool count, life set, counter used, remaining
            and usage percent, plus the in-use / next / selected group. Needs the CNC's
            <em>tool life management</em> option — without it the node reports the
            controller's <code>EW_NOOPT</code>.</dd>
        <dt>Tool Offsets</dt><dd>The tool compensation table: how many offsets the machine
            has (<code>use_no</code>), the memory type, and every offset's value per type
            (cutter radius / tool length, wear / geometry). <strong>Read-only</strong> —
            the node has no write path for offsets. Needs the CNC's tool compensation
            option; without it the controller answers <code>EW_NOOPT</code>.</dd>
        <dt>Alarm Messages</dt><dd>Active alarms with type, code, axis, text. Message text is
            capped at 32 characters by <code>cnc_rdalmmsg</code> on every series.</dd>
        <dt>Alarm Status</dt><dd>The alarm <em>status word</em> (<code>status</code>) plus the
            set bits decoded (<code>bits</code>: bit number and its per-series label). Cheaper
            than the messages and can be set with nothing in <em>Alarm Messages</em> to match
            it — a status bit is a condition, not always a message.</dd>
        <dt>PMC Alarms</dt><dd>The PMC's own ERxx/WNxx messages (ROM parity, I/O allocation
            errors, ladder size errors). Not the ladder's external (EX) messages — those
            arrive as CNC alarms and appear under <em>Alarm Messages</em>.</dd>
        <dt>Macro</dt><dd>Custom macro variable values by number</dd>
    </dl>

    <h3>Identity &amp; context</h3>
    <dl class="message-properties">
        <dt>Machine ID</dt><dd><code>cncid</code> — the CNC's own identity, four unsigned
            longs as a hex string. This is the only identifier here that survives a software
            upgrade, so a multi-machine flow should key on it rather than on
            <code>series</code>/<code>version</code>, which every machine of the same model
            shares. <strong>0i-D/F and 30i only.</strong></dd>
        <dt>Calendar</dt><dd>The CNC clock: <code>year</code>, <code>month</code>,
            <code>day</code>, <code>hour</code>, <code>minute</code>, <code>second</code>,
            plus <code>date</code>, <code>time</code> and <code>iso_like</code> strings.
            The CNC clock carries no timezone — it is not UTC and not necessarily local.
            One call returns both date and time.</dd>
        <dt>Status Info (extended)</dt><dd><code>cnc_statinfo2</code>: the same run state as
            <em>Status Info</em> plus <code>warning</code>, <code>o3d_check</code>,
            <code>ext_option</code> and <code>restart</code>. <strong>0i-D/F and 30i
            only</strong> — on older series it answers <code>EW_FUNC</code>.</dd>
        <dt>Program Memory</dt><dd><code>registered_programs</code>,
            <code>available_programs</code>, <code>used_memory</code>,
            <code>unused_memory</code> and <code>used_percent</code> (null when the total is
            zero, never 0 %).</dd>
        <dt>Sequence Number</dt><dd>The N number of the block being executed. A program with
            no N numbers leaves this at the last one it saw, so treat it as a progress hint,
            not an exact position.</dd>
        <dt>Block Counter</dt><dd>The CNC's block counter. Needs the <em>program
            restarting</em> option; without it the controller answers
            <code>EW_NOOPT</code>.</dd>
    </dl>

    <h3>Commands &amp; messages</h3>
    <dl class="message-properties">
        <dt>Modal / Commanded F,S,T</dt><dd>Choose <em>Modal</em> for what is in effect or
            <em>Commanded</em> for what the current block asks for. Returns
            <code>commands</code> keyed by address (<code>F</code>, <code>S</code>,
            <code>T</code>, <code>M1</code>…), each with <code>value</code>,
            <code>raw</code> and <code>dec</code>. Only records the controller marks as
            present are included, so a missing key means <em>no command</em> — not a zero.
            <strong>Not available on 16i/18i/21i</strong>; those need <code>cnc_modal</code>,
            which this node does not implement.</dd>
    </dl>

    <h3>Offsets &amp; maintenance</h3>
    <dl class="message-properties">
        <dt>Work Zero Offsets</dt><dd><code>use_no</code> and one entry per offset number,
            each with a value per axis (<code>value</code>, <code>raw</code>,
            <code>dec</code>, <code>unit</code>). <strong>Read-only</strong> — the node has
            no write path for offsets. An axis the table does not have is null, not zero.</dd>
        <dt>Maintenance Items</dt><dd>The CNC's maintenance items 1–10: <code>name</code>,
            <code>type</code>, <code>total</code>, <code>remain</code>, <code>stat</code> and
            <code>remain_percent</code> (null when <code>total</code> is zero). The unit
            follows <code>type</code> and the interface does not return it, so the raw
            numbers are kept.</dd>
    </dl>

    <h3>PMC Read</h3>
    <p>Reads machine-builder signals straight out of the PMC — door interlocks, clamps,
       cycle-complete, counters, whatever the ladder exposes. The address map belongs to the
       machine builder, so nothing here interprets the values.</p>
    <p>Give a comma-separated list of addresses, up to 128:</p>
    <pre>R0.0            one bit of R0
R0              R0 as a byte
D100:word       D100 as a 16-bit word
D100:long       D100 as a 32-bit long
K0.0            one bit of K0</pre>
    <p>Areas: <code>G F Y X A R T K C D</code>. Each result carries
       <code>spec</code>, <code>area</code>, <code>address</code>, <code>value</code> and
       either <code>bit</code> or <code>type</code>+<code>hex</code>.</p>
    <p><strong>Read-only.</strong> There is no PMC write path in this node.</p>

    <h3>Series support</h3>
    <p>The identity and context functions are not on every series. From each function's
       vendor support table, and this node is Ethernet-only — so "HSSB only" and "cannot be
       used" both mean <em>not on this machine</em>:</p>
    <table>
      <tr><th>Function</th><th>Available on</th></tr>
      <tr><td>Machine ID, Status Info (extended)</td><td>0i-D/F, 30i</td></tr>
      <tr><td>Maintenance Items</td><td>16i-B and later</td></tr>
      <tr><td>Modal / Commanded F,S,T</td><td>15i, 0i-D/F, 30i (not 16i/18i/21i)</td></tr>
      <tr><td>Everything else here</td><td>15i and later, but HSSB-only on the non-i series</td></tr>
    </table>
    <p>A function the series does not have answers <code>EW_FUNC</code> or
       <code>EW_NODLL</code>. In <em>All Data</em> that becomes a <code>null</code> field and
       the reason is written to the Node-RED log as a warning, so it never blanks the rest of
       the snapshot — but on an older machine it costs a round trip per poll. Use the
       individual functions for a mixed fleet.</p>

    <h3>Failures</h3>
    <p>The payload carries <strong>no error channel</strong> — it is pure data, so it can be
       mapped straight onto OPC UA, MQTT or a database. A field that could not be read is
       <code>null</code>, and the reason appears in the Node-RED log as a warning.</p>
    <p><code>null</code> means <em>not read</em>; <code>[]</code> means <em>read cleanly, found
       nothing</em>; a number means the controller reported that number. The three are
       deliberately distinguishable.</p>
    <p>The single-value Functions raise instead, so poll one of those if you want a failure to
       surface as a node error.</p>

    <h3>Dynamic override</h3>
    <p>Set <code>msg.function</code>, <code>msg.subtype</code>, or <code>msg.params</code> to override the configured values at runtime.</p>

    <h3>Notes</h3>
    <p>FOCAS is strictly sequential. Each node maintains its own TCP connection per poll cycle.</p>
    <p>The controller accepts only a few concurrent sessions (5 on the machine this was measured
       against), so a node runs its polls one at a time — a message arriving mid-poll waits its
       turn instead of colliding. If every session is in use the controller refuses the new one
       and the node says so, with the raw reply, rather than reporting a generic handshake failure.</p>
</script>
